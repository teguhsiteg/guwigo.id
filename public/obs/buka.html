<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Buka Puasa & Jadwal OBS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        color: #fdf5e6;
      }

      .ramadan-widget {
        background: linear-gradient(
          135deg,
          rgba(11, 28, 43, 0.95),
          rgba(4, 15, 22, 0.98)
        );
        border: 2px solid #d4af37;
        border-radius: 20px;
        padding: 30px 50px;
        text-align: center;
        box-shadow:
          0 15px 35px rgba(0, 0, 0, 0.8),
          0 0 30px rgba(212, 175, 55, 0.15) inset;
        position: relative;
        min-width: 450px;
      }

      .decorations {
        font-size: 28px;
        color: #d4af37;
        letter-spacing: 15px;
        margin-bottom: 15px;
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
      }

      .datetime-container {
        font-family: "Roboto", sans-serif;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 12px;
        border: 1px solid rgba(212, 175, 55, 0.3);
      }

      #realtime-clock {
        font-size: 48px;
        font-weight: 800;
        color: #ffffff;
        line-height: 1;
        text-shadow: 0 2px 10px rgba(255, 255, 255, 0.3);
        font-variant-numeric: tabular-nums;
      }

      #date-masehi {
        font-size: 16px;
        color: #a0b2a6;
        margin-top: 5px;
        font-weight: 600;
      }

      #date-hijri {
        font-size: 18px;
        color: #d4af37;
        font-family: "Amiri", serif;
        font-weight: 700;
        margin-top: 5px;
        letter-spacing: 1px;
      }

      .divider {
        width: 80%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #d4af37, transparent);
        margin: 20px auto;
      }

      #countdown-title {
        font-family: "Amiri", serif;
        font-size: 26px;
        color: #d4af37;
        font-weight: 700;
        margin-bottom: 5px;
      }

      #maghrib-timer {
        font-family: "Poppins", sans-serif;
        font-size: 65px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: #ffd700;
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        line-height: 1.1;
      }

      .location {
        font-family: "Poppins", sans-serif;
        font-size: 14px;
        color: #8fa396;
        margin-top: 15px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="ramadan-widget">
      <div class="decorations">🏮🌙🏮</div>

      <div class="datetime-container">
        <div id="realtime-clock">00:00:00</div>
        <div id="date-masehi">Memuat Tanggal...</div>
        <div id="date-hijri">Memuat Hijriyah...</div>
      </div>

      <div class="divider"></div>

      <div id="countdown-title">Menuju Buka Puasa</div>
      <div id="maghrib-timer">--:--:--</div>

      <div class="location">Yogyakarta & Sekitarnya</div>
    </div>

    <script>
      const city = "Yogyakarta";
      const country = "Indonesia";
      const apiUrl = `https://api.aladhan.com/v1/timingsByCity?city=${city}&country=${country}&method=20`;

      const namaHari = [
        "Minggu",
        "Senin",
        "Selasa",
        "Rabu",
        "Kamis",
        "Jumat",
        "Sabtu",
      ];
      const namaBulan = [
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember",
      ];

      async function initWidget() {
        try {
          const response = await fetch(apiUrl);
          const data = await response.json();

          const hijri = data.data.date.hijri;
          document.getElementById("date-hijri").innerHTML =
            `${hijri.day} ${hijri.month.en} ${hijri.year} H`;

          const maghribTimeStr = data.data.timings.Maghrib;
          const [hours, minutes] = maghribTimeStr.split(":");
          const maghribDate = new Date();
          maghribDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);

          const clockEl = document.getElementById("realtime-clock");
          const masehiEl = document.getElementById("date-masehi");
          const timerEl = document.getElementById("maghrib-timer");
          const titleEl = document.getElementById("countdown-title");

          const interval = setInterval(() => {
            const now = new Date();

            const jam = String(now.getHours()).padStart(2, "0");
            const mnt = String(now.getMinutes()).padStart(2, "0");
            const dtk = String(now.getSeconds()).padStart(2, "0");
            clockEl.innerHTML = `${jam}:${mnt}:${dtk}`;

            const hari = namaHari[now.getDay()];
            const tanggal = now.getDate();
            const bulan = namaBulan[now.getMonth()];
            const tahun = now.getFullYear();
            masehiEl.innerHTML = `${hari}, ${tanggal} ${bulan} ${tahun}`;

            const diff = maghribDate - now;

            if (diff <= 0) {
              titleEl.innerHTML = "Waktu Buka Puasa (Maghrib)";
              timerEl.innerHTML = "Selamat Berbuka!";
              timerEl.style.fontSize = "40px";
              timerEl.style.color = "#4ade80";
              timerEl.style.textShadow = "0 0 20px rgba(74, 222, 128, 0.6)";
            } else {
              const h = Math.floor(
                (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
              );
              const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
              const s = Math.floor((diff % (1000 * 60)) / 1000);

              timerEl.innerHTML =
                String(h).padStart(2, "0") +
                ":" +
                String(m).padStart(2, "0") +
                ":" +
                String(s).padStart(2, "0");
            }
          }, 1000);
        } catch (error) {
          console.error("Gagal mengambil data dari API Aladhan:", error);
          document.getElementById("maghrib-timer").innerHTML = "Error API";
          document.getElementById("date-hijri").innerHTML =
            "Gagal memuat kalender";
        }
      }
      initWidget();
    </script>
  </body>
</html>
